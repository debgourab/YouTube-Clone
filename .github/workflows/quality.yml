name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install client dependencies
        run: npm ci --prefix client --no-audit --no-fund
      - name: Install server dependencies
        run: npm ci --prefix server --no-audit --no-fund
      - name: Lint client and server
        run: |
          npm run lint --prefix client
          npm run lint --prefix server
      - name: Unit and API validation tests
        run: |
          npm test --prefix client
          npm test --prefix server
      - name: Production build
        run: npm run build --prefix client
      - name: Install Chromium
        run: npx --prefix client playwright install --with-deps chromium
      - name: Desktop and mobile regression tests
        run: npm run test:e2e --prefix client
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: client/test-results
          retention-days: 7
